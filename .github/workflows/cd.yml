name:  Squealify CD Pipeline

on:
  push:
    branches:
      - master

jobs:

  build:
    environment: production
    permissions:
      contents: read
      id-token: write  # GitHub OIDC token for nuget.org trusted publishing
    strategy:
      matrix:
        targetplatform: [x64]

    runs-on: windows-latest

    env:
      Configuration: Release
      Solution_Path: Squealify.slnx
      Source_Project_Path: Squealify.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore project
      run: dotnet restore $env:Solution_Path

    - name: Test
      run: dotnet test $env:Solution_Path -c $env:Configuration

    - name: Build Squealify project
      run: dotnet build $env:Source_Project_Path -c $env:Configuration

    - name: Package
      run: dotnet pack -c $env:Configuration --no-build -o . $env:Source_Project_Path

    - name: NuGet login (OIDC trusted publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: AlexandruMacocian

    - name: Publish
      run: dotnet nuget push *.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
